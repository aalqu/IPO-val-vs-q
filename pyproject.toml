[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ipo-study"
version = "1.4.0"
description = "Large-cap IPOs 2010-2025: traditional valuation screens vs systematic (quant) rules. Reproducible study."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []                      # the study itself uses only the Python standard library

[project.optional-dependencies]
test = ["pytest>=7", "openpyxl>=3.1", "xlrd>=2.0"]
fetch = ["yfinance>=0.2.40"]
industry = ["xlrd>=2.0", "openpyxl>=3.1"]
pdf = ["playwright>=1.40"]

[project.scripts]
ipo-study = "ipo_study.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
ipo_study = ["site_template.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
